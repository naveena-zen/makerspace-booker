name: CD Pipeline & Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push-deploy:
    name: Build, Push to GHCR & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images to GHCR
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="sha-${{ github.sha }}"

          SERVICES=("monolith:monolith" "machine-service:services/machine-service" "certification-service:services/certification-service" "reservation-service:services/reservation-service" "gateway:services/gateway")

          for ITEM in "${SERVICES[@]}"; do
            NAME="${ITEM%%:*}"
            DIR="${ITEM#*:}"
            IMAGE="ghcr.io/${OWNER_LC}/makerspace-booker-${NAME}"

            echo "=== Building and pushing ${IMAGE} from ${DIR} ==="
            docker build \
              -t "${IMAGE}:${SHA_TAG}" \
              -t "${IMAGE}:latest" \
              "${DIR}"
            docker push "${IMAGE}:${SHA_TAG}"
            docker push "${IMAGE}:latest"
          done

      - name: Run Microservices via Docker Compose
        run: |
          docker compose up -d --build
          echo "Waiting 10 seconds for services to initialize..."
          sleep 10

      - name: Smoke Test All Service Health Endpoints
        run: |
          set -e
          ENDPOINTS=(
            "Gateway:http://localhost:3000/health"
            "Machine Service:http://localhost:3001/health"
            "Certification Service:http://localhost:3002/health"
            "Reservation Service:http://localhost:3003/health"
          )

          for ENTRY in "${ENDPOINTS[@]}"; do
            NAME="${ENTRY%%:*}"
            URL="${ENTRY#*:}"

            echo "Testing ${NAME} at ${URL}..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 2 --retry-all-errors "${URL}")
            echo "${NAME} responded with HTTP ${STATUS}"

            if [ "$STATUS" -ne 200 ]; then
              echo "Error: ${NAME} health check failed with status ${STATUS}"
              docker compose logs
              exit 1
            fi
          done

          echo "All health checks passed with status 200 OK!"

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v
